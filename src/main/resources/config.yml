# MythicBedwars Configuration

# Cross-server event games ("recruit from the SMP")
#
# The same jar runs on both the survival server and the Bedwars server; `role` decides which half
# boots here. Leave `enabled: false` for a standalone Bedwars server - nothing below is read then,
# and the plugin behaves exactly as it always has.
network:
  enabled: false
  # SMP      - the survival server players are recruited from (MBedwars not required)
  # MINIGAME - the Bedwars server that hosts the matches
  role: MINIGAME

  # Unique per backend, and REQUIRED once network.enabled is true. Two servers sharing an id
  # overwrite each other's heartbeat and each accepts messages addressed to the other.
  server-id: "bw-1"

  # Server names as they appear in velocity.toml. Requires bungee-plugin-message-channel to be
  # enabled on the proxy (it is by default).
  velocity:
    # This backend's own name - what other servers use to reach it.
    this-server: "bedwars"
    # Where finished players are sent back to.
    smp-server: "survival"
    # Where recruited players are sent.
    minigame-server: "bedwars"
    # Ticks between consecutive transfers when moving a whole roster.
    transfer-stagger-ticks: 5

  redis:
    host: "127.0.0.1"
    port: 6379
    password: ""
    database: 0
    ssl: false
    timeout-ms: 2000
    # Prefix for every key this plugin writes. Deliberately different from Circle of Imagination's
    # "coi" prefix, so both plugins can share one Redis instance.
    namespace: "mythicbedwars"
    pool:
      max-total: 8
      max-idle: 4
      min-idle: 1

  event:
    enabled: true
    # A match below min-players is not worth running; max-players is the roster cap the SMP
    # advertises, further capped by the chosen arena's real capacity.
    min-players: 4
    max-players: 16

    # --- SMP role: offering events without being asked -----------------------
    # Off by default. With it on, the survival server offers a match on its own whenever enough
    # people have been standing around doing nothing - which is the difference between a feature
    # that runs and one that waits for an admin to remember it exists.
    auto-propose: false
    auto-propose-interval-seconds: 300
    auto-propose-min-idle-players: 8
    # How long without moving counts as "idle", i.e. as somebody who might welcome something to do.
    idle-threshold-seconds: 300
    # How long signups stay open once a host accepts.
    # Read by the MINIGAME role only: the host commits to holding its arena until this deadline and
    # sends it in its acceptance, so the SMP honours the host's value rather than its own.
    signup-seconds: 120
    # Seconds-remaining marks at which to re-broadcast the offer.
    signup-reminders: [ 90, 60, 30, 10 ]
    # How long to wait for a Bedwars server to answer a proposal.
    propose-timeout-seconds: 10
    # How long the host holds its arena open for recruits to cross the proxy.
    arrival-grace-seconds: 60
    # After the arrival window, how long spare slots stay open to players already on the Bedwars
    # server. Set to 0 to keep event matches strictly roster-only.
    fill-window-seconds: 20
    # Countdown pushed out each second so MBedwars never auto-starts a held arena.
    lobby-hold-seconds: 120
    # Visible countdown once the match is actually going ahead.
    start-countdown-seconds: 5
    # Fewest arrivals worth starting with, however many signed up.
    min-arrivals: 4
    # How long an eliminated player may linger before being sent home automatically.
    auto-return-seconds: 30
    # Pause after the final kill before winners are moved, so the celebration is not cut short.
    winner-return-delay-seconds: 15
    # How often stale or orphaned events are swept up.
    reap-interval-seconds: 30
    # Quiet period after an event finishes, so a busy server does not spam offers.
    cooldown-minutes: 60
    # How long an event's Redis keys survive without an update. A half-finished event frees itself.
    event-ttl-seconds: 900
    # Event matches always run with magic on, bypassing the usual vote.
    force-magic: true
    # Whether spectators may watch an event match. With this off, a player who dies and chooses to
    # spectate is offered a ride home instead.
    allow-spectators: true
    # Whether players already on the Bedwars server are told when spare slots open to them. Without
    # it they have no way of knowing - the recruitment broadcast goes out on the survival server.
    announce-locally: true

    # How often an in-flight event reconciles against its durable Redis record. Pub/sub has no
    # replay, so this is what turns a dropped message into a two-second delay rather than an event
    # that never finishes.
    sync-interval-seconds: 2

    # Team count to favour when several arenas hold the turnout equally well. Four is the classic
    # Bedwars shape: it is what makes sixteen players land on a 4x4 rather than an 8x2, and four
    # players on a 1v1v1v1 rather than a 2v2. Capacity fit always comes first.
    preferred-team-count: 4

    # Empty whitelist means any eligible arena. Blacklist always wins.
    arena-whitelist: []
    arena-blacklist: []
    # Favoured when several arenas fit equally well.
    prefer-arenas: []

  heartbeat:
    # How often this server republishes its liveness key, and how long that key survives without a
    # refresh. A server that dies simply stops appearing once its key expires.
    interval-seconds: 5
    ttl-seconds: 15
    stale-after-seconds: 20

# Global plugin settings
global:
  enabled: true

voting:
  # Enable voting system
  enabled: true
  # Delay in seconds before giving voting items to players
  item-delay: 3
  # Show reminders to vote
  reminders-enabled: true
  # Interval between reminders in seconds
  reminder-interval: 10
  # Maximum number of reminders
  max-reminders: 5

# Acting progression multipliers
acting:
  # Base amount of acting gained per second
  passive-amount: 10
  # Multiplier for passive acting gain
  passive-multiplier: 1.0
  # Multiplier for kills
  kill-multiplier: 5.0
  # Multiplier for final kills
  final-kill-multiplier: 7.0
  # Multiplier for breaking enemy beds
  bed-break-multiplier: 10.0
  # Fraction of current acting lost on regular death (0.0 = disabled, 0.15 = 15%)
  death-penalty: 0.15
  # Per-sequence passive acting multipliers (higher sequence = weaker player = faster gain)
  sequence-multipliers:
    9: 3.5
    8: 3.0
    7: 2.5
    6: 1.3
    5: 1.1
    4: 0.4
    3: 0.3
    2: 0.2
    1: 0.1
    0: 0.05

# Pathway settings
pathways:
  # Automatically balance pathway assignments based on win rates
  auto-balance: true
  # Threshold for considering a pathway overpowered/underpowered (10% = 0.1)
  balance-threshold: 0.1
  # Minimum games required before a pathway is included in balancing calculations
  min-games-for-balance: 3
  # List of disabled pathways (pathway names)
  disabled: []
  # List of blocked abilities (ability names)
  blocked-abilities:
    - "thread-hands"
    - "nightmare"
    - "travellers-door"
    - "divination"

# Shop limits, per sequence. Omitted or -1 means unlimited.
# Keys are sequence-0 .. sequence-9, where a LOWER number is a stronger Beyonder - so the tighter
# limits belong at the low end.
shop:
  max-purchases: { }

# Spectator features
spectator:
  # Enable magical spectator features
  enabled: true
  # Default settings for new spectators
  hud-default: true
  actionbar-default: true
  detailed-default: false
  # Update interval in ticks (20 = 1 second)
  update-interval-ticks: 20

statistics:
  save-interval-seconds: 300

# Arena-specific settings (optional overrides)
arenas:
# Example:
# arena-name:
#   enabled: true
#   spectator-features: true