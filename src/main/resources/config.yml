network:
  enabled: false
  # SMP or MINIGAME
  role: MINIGAME
  server-id: "bw-1"

  velocity:
    this-server: "bedwars"
    smp-server: "survival"
    minigame-server: "bedwars"
    transfer-stagger-ticks: 5

  redis:
    host: "127.0.0.1"
    port: 6379
    password: ""
    database: 0
    ssl: false
    timeout-ms: 2000
    namespace: "mythicbedwars"
    pool:
      max-total: 8
      max-idle: 4
      min-idle: 1

  event:
    enabled: true
    min-players: 4
    max-players: 16

    schedule:
      enabled: true
      # fractions allowed, 0.5 = every 30 minutes
      interval-hours: 5
      min-players: 40
      check-seconds: 120

      countdown:
        enabled: true
        broadcast-minutes: [ 60, 30, 10 ]
        shortfall-warn-minutes: 60
    signup-seconds: 120
    signup-reminders: [ 90, 60, 30, 10 ]
    propose-timeout-seconds: 10
    arrival-grace-seconds: 60
    fill-window-seconds: 20
    lobby-hold-seconds: 120
    start-countdown-seconds: 5
    min-arrivals: 4
    auto-return-seconds: 30
    winner-return-delay-seconds: 15
    reap-interval-seconds: 30
    cooldown-minutes: 60
    event-ttl-seconds: 900
    force-magic: true
    # TEAM, INDIVIDUAL or RANDOM
    magic-mode: RANDOM
    allow-spectators: true
    announce-locally: true
    sync-interval-seconds: 2
    preferred-team-count: 4
    arena-whitelist: []
    arena-blacklist: []
    prefer-arenas: []

  heartbeat:
    interval-seconds: 5
    ttl-seconds: 15
    stale-after-seconds: 20

global:
  enabled: true

voting:
  enabled: true
  individual-enabled: true
  # TEAM, INDIVIDUAL or OFF
  default-mode: TEAM
  # fraction of the lobby, 0.1 = 10%
  min-participation: 0.1
  item-delay: 3
  reminders-enabled: true
  reminder-interval: 10
  max-reminders: 5

acting:
  passive-amount: 10
  passive-multiplier: 1.0
  kill-multiplier: 5.0
  final-kill-multiplier: 7.0
  bed-break-multiplier: 10.0
  # fraction of current acting, 0.15 = 15%
  death-penalty: 0.15
  sequence-multipliers:
    9: 3.5
    8: 3.0
    7: 2.5
    6: 1.3
    5: 1.1
    4: 0.4
    3: 0.3
    2: 0.2
    1: 0.1
    0: 0.05

pathways:
  auto-balance: true
  balance-threshold: 0.1
  min-games-for-balance: 20
  disabled: []
  crafting:
    kill-drops: true
    # empty list means every pathway
    pathways: [ paragon, moon ]
    kill-drop-chance: 0.7
    final-kill-drop-chance: 1.0
  blocked-abilities:
    - "thread-hands"
    - "nightmare"
    - "travellers-door"
    - "divination"

shop:
  # sequence-0 .. sequence-9 -> max purchases, -1 or omitted = unlimited
  max-purchases: { }
  materials:
    enabled: true
    pathways: [ ]
    max-per-match: 8

combat:
  projectile-cooldowns:
    enabled: true
    # seconds; vanilla item keys or an MBedwars special-id as shop.yml spells it
    items:
      bow: 1.5
      crossbow: 2.0
      fireball: 3.0
      egg: 1.0
      snowball: 0.5
      ender_pearl: 5.0

spectator:
  enabled: true
  hud-default: true
  actionbar-default: true
  detailed-default: false
  update-interval-ticks: 20

statistics:
  save-interval-seconds: 300

arenas: {}
