rewards:
  enabled: true

  queue-ttl-days: 30
  max-queued-bundles: 10
  max-bundles-per-day: 8
  max-bundles-per-day-hard: 16

  acting-source: EVENT

  non-beyonder-policy: SUBSTITUTE
  fallback-bottle-acting: 300
  cooldown-substitute-percent: 2.0
  cooldown-substitute-ratio: 0.1

  item-overflow: REQUEUE

  # lower sequence is stronger: 9 offers only the weakest tier
  token-sequences:
    9: 38
    8: 24
    7: 15
    6: 8
    5: 6
    4: 4.5
    3: 2.5
    2: 1.5
    1: 0.5

  performance:
    acting-percent-per-point: 0.08
    max-acting-percent: 3.0

  eligibility:
    min-play-time-seconds: 120
    min-actions: 1
    min-players: 4
    min-participation-ratio: 0.10
    participation-scale-floor: 0.5
    deny-rage-quit: true

  redeem:
    delay-ticks: 60
    max-bundles-per-join: 5

  tiers:
    participation:
      rolls: 1
      guaranteed:
        - { kind: ACTING_PERCENT, min-percent: 0.5, max-percent: 1.25 }
      pool:
        - { kind: COOLDOWN_CREDIT, weight: 40, min-percent: 4, max-percent: 9 }
        - { kind: ITEM, weight: 30, item: ACTING_BOTTLE, min-percent: 0.5, max-percent: 1.0 }
        - { kind: ITEM, weight: 20, item: SPIRITUALITY_POTION, tier: small, amount: 25 }
        - { kind: ACTING_SPEED, weight: 10, min-value: 0.10, max-value: 0.20, duration-seconds: 1800 }

    winner:
      rolls: 1
      guaranteed:
        - { kind: ACTING_PERCENT, min-percent: 1.0, max-percent: 2.0 }
      pool:
        - { kind: COOLDOWN_CREDIT, weight: 30, min-percent: 10, max-percent: 20 }
        - { kind: ACTING_SPEED, weight: 20, min-value: 0.25, max-value: 0.50, duration-seconds: 3600 }
        - { kind: ACTING_ITEM_MULT, weight: 10, min-value: 1.25, max-value: 1.50, duration-seconds: 3600 }
        - { kind: ITEM, weight: 15, item: ACTING_BOTTLE, min-percent: 1.5, max-percent: 2.5 }
        - { kind: ITEM, weight: 10, item: ACTING_MULTIPLIER, tier: small, min-value: 1.5, max-value: 1.5, duration-seconds: 3600 }
        - { kind: ITEM, weight: 8, item: INGREDIENT_TOKEN }
        - { kind: ITEM, weight: 5, item: RECIPE_TOKEN }
        - { kind: ITEM, weight: 2, item: UNIVERSAL_POTION_TOKEN }

    mvp:
      enabled: true
      rolls: 1
      min-score: 8.0
      score:
        kill: 0.5
        final-kill: 3.0
        bed-break: 5.0
      guaranteed:
        - { kind: ACTING_PERCENT, min-percent: 1.0, max-percent: 2.0 }
      pool:
        - { kind: ITEM, weight: 70, item: ACTING_BOTTLE, min-percent: 2.0, max-percent: 4.0 }
        - { kind: ITEM, weight: 18, item: ANTI_CONTROL_CHARM, epic: true }
        - { kind: ITEM, weight: 12, item: RITUAL_BOOK, amount: 1, epic: true }
