plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
}

group = 'dev.ua.ikeepcalm'
version = '1.2.0'

repositories {
    mavenCentral()
    maven {
        url = "https://nexus.mysterria.net/repository/plugin-public/"
    }
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven {
        url = 'https://repo.marcely.de/repository/maven-public/'
    }
    maven { url 'https://jitpack.io' }
}

// Single source of truth for anything Paper resolves at runtime through plugin.yml's `libraries:`.
// Bumping only one of the two would compile cleanly and then fail with NoSuchMethodError in
// production, so processResources expands these into plugin.yml below.
ext.jedisVersion = '5.2.0'
ext.commonsPoolVersion = '2.12.0'
ext.sqliteVersion = '3.49.1.0'

dependencies {
    // Loaded reflectively from Plan's own classloader; never needs to be on our runtime classpath.
    compileOnly 'com.github.plan-player-analytics:Plan:5.6.2965'
    compileOnly("io.papermc.paper:paper-api:26.1.2.build.+")
    compileOnly 'de.marcely.bedwars:API:5.5.7'
    // Present at runtime via plugin.yml `libraries:`, not bundled - there is no shadow plugin here.
    compileOnly "redis.clients:jedis:${jedisVersion}"
    compileOnly "org.apache.commons:commons-pool2:${commonsPoolVersion}"
    compileOnly "org.xerial:sqlite-jdbc:${sqliteVersion}"
    compileOnly 'dev.ua.ikeepcalm:circle-of-imagination-api:1.4.8-SNAPSHOT'
}

tasks {
    runServer {
        // Configure the Minecraft version for our task.
        // This is the only required configuration besides applying the plugin.
        // Your plugin's jar (or shadowJar if present) will be used automatically.
        minecraftVersion("26.1.2")
    }
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [
            version           : version,
            jedisVersion      : jedisVersion,
            commonsPoolVersion: commonsPoolVersion,
            sqliteVersion     : sqliteVersion
    ]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
